[project]
name = "trustilo"
version = "0.1.0"
description = "Trustilo: multi-agent, evidence-grounded security-questionnaire response and compliance assurance."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "langgraph",
    "asyncpg",
    "pgvector",
    "openpyxl",
    "pdfplumber",
    "anthropic",
    "openai",
    "structlog",
    "tenacity",
    "python-dotenv",
]

# Starting point only — see specs/13-tech-stack-and-repo-layout.md for
# the reasoning behind each of these and how to swap them. No version
# pins on purpose: resolve current compatible versions with your tool
# of choice (uv sync / pip install) and let your lockfile pin them,
# rather than trusting stale pins written before the project started.

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "mypy",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trustilo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
